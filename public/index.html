<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat agent</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23c2410c'/><circle cx='16' cy='16' r='5' fill='white'/></svg>" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <button id="new-chat" type="button">New chat</button>
      <nav id="conversations" aria-label="Conversations"></nav>
      <p id="model-note"></p>
    </aside>

    <main>
      <div id="notice" hidden></div>
      <div id="scroll">
        <div id="thread"></div>
      </div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Ask anything. It remembers what you asked before." autofocus></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>

    <script src="/vendor/marked.js"></script>
    <script src="/vendor/purify.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
